name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Выкачиваем репозиторий
      - uses: actions/checkout@v3

      # 2. Настраиваем Java 17
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Устанавливаем браузер Chrome
      - uses: browser-actions/setup-chrome@v1

      # 4. Устанавливаем системные библиотеки (libasound2t64 вместо устаревшего libasound2)
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm1 libxss1 libnss3 libasound2t64

      # 5. Даем права на запуск скрипта gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Запускаем тесты
      - name: Run tests
        run: ./gradlew clean test