name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Выкачиваем репозиторий
      - uses: actions/checkout@v3

      # 2. Настраиваем Java 17
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Запускаем Selenoid (добавили версию браузера, чтобы избежать сбоев)
      - uses: Xotabu4/selenoid-github-action@v2
        with:
          browsers: 'chrome'
          # Явно указываем версию, чтобы экшен не пытался скачать "последнюю", что часто ломается
          chrome-version: '127.0'

      # 4. Даем права на запуск gradlew (ЭТОГО НЕ ХВАТАЛО)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Запускаем тесты
      - run: ./gradlew clean test -Dselenide.remote=http://localhost:4444/wd/hub