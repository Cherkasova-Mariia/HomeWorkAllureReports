name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # выкачиваем репозиторий
      - uses: actions/checkout@v3

      # настраиваем java
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ЭТОГО НЕ ХВАТАЕТ - устанавливаем Chrome
      - uses: browser-actions/setup-chrome@v1

      # запускаем тесты
      - run: ./gradlew clean test